name: Paper portfolio to Telegram

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/paper-portfolio.yml

permissions:
  contents: write

concurrency:
  group: cryptoai-live-signals
  cancel-in-progress: false

jobs:
  signal:
    if: github.event.repository.private == false && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Download models from the last complete publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m app.portfolio_models download
      - name: Match the model training runtime
        run: python -m pip install --no-cache-dir -r data/models/portfolio-runtime.txt
      - name: Trade shared virtual wallet and notify executed buys or sells
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m app.portfolio_runner | tee "$RUNNER_TEMP/portfolio-cycle.log"
      - name: Summarize portfolio cycle
        if: always()
        shell: bash
        run: |
          printf '### Paper portfolio cycle\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/portfolio-cycle.log" ]; then
            cat "$RUNNER_TEMP/portfolio-cycle.log" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Portfolio runner did not start. Inspect the preceding steps.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
