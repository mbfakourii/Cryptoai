name: Train signal models

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 1'

permissions:
  contents: write

concurrency:
  group: cryptoai-training
  cancel-in-progress: false

jobs:
  train:
    if: github.event.repository.private == false && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - run: python -m pytest -q
      - name: Fetch closed candles and train both models
        run: |
          python -m app.cli fetch --symbol BTCUSDT --limit 10000
          python -m app.cli fetch --symbol ETHUSDT --limit 10000
          python -m app.cli train --symbol BTCUSDT --horizon 12 --threshold 0.65
          python -m app.cli train --symbol ETHUSDT --horizon 12 --threshold 0.65
      - name: Publish models to repository storage without paid artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m app.model_registry upload
