name: Train 50-market portfolio

on:
  workflow_dispatch:
  schedule:
    - cron: '43 1 * * 1'

permissions:
  contents: write

concurrency:
  group: cryptoai-portfolio-training
  cancel-in-progress: false

jobs:
  train:
    if: github.event.repository.private == false && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - run: python -m pytest -q
      - run: python -m app.portfolio_models train
      - name: Publish one complete pooled model for 50 markets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m app.portfolio_models upload
