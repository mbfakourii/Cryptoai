name: Portfolio ten-minute timer

on:
  workflow_dispatch:
    inputs:
      next_slot:
        description: Next ten-minute UTC slot; leave empty to start now
        type: string
        required: false
      cycles:
        description: Cycles before handing off to the next timer (1 to 30)
        type: number
        default: 30
        required: true
  push:
    branches:
      - main
    paths:
      - .github/workflows/portfolio-scheduler.yml
      - app/workflow_scheduler.py

permissions:
  contents: read
  actions: write

concurrency:
  group: cryptoai-portfolio-scheduler
  cancel-in-progress: false

jobs:
  timer:
    if: github.event.repository.private == false && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dispatch portfolio every ten minutes and hand off before runner expiry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCHEDULER_CYCLES: ${{ github.event_name == 'push' && '1' || inputs.cycles }}
          SCHEDULER_NEXT_SLOT: ${{ inputs.next_slot }}
        run: python -u -m app.workflow_scheduler
